<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Saved Treats – Sweet Drip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Figtree:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="vendor/phosphor/regular/style.css" />
  <link rel="stylesheet" href="vendor/phosphor/fill/style.css" />
  <link rel="stylesheet" href="vendor/phosphor/duotone/style.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/story.css" />
  <link rel="stylesheet" href="css/pin.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/controls.css" />
  <link rel="stylesheet" href="css/upgrade.css" />
  <link rel="stylesheet" href="css/business.css" />
</head>
<body data-page="saved">
  <div id="site-header"></div>

  <section class="profile container">
    <div class="ava"><i class="ph-fill ph-heart"></i></div>
    <h1>Your favourites</h1>
    <p id="savedStats">0 saved treats</p>
    <div class="phero-cta">
      <a href="menu.html" class="btn btn-ghost"><i class="ph ph-magnifying-glass"></i> Find more treats</a>
      <button class="btn btn-primary" id="cartBtnSaved" onclick="document.getElementById('cartBtn').click()"><i class="ph ph-basket"></i> View cart</button>
    </div>
  </section>

  <main class="container" style="max-width: 1600px; padding-bottom: 60px">
    <div class="pin-grid" id="savedGrid"></div>
    <div class="empty-board" id="savedEmpty">
      <i class="ph-duotone ph-heart"></i>
      <h3>Nothing saved yet</h3>
      <p>Tap the red <b>Save</b> button on any dessert to keep it here.</p>
      <a href="menu.html" class="btn btn-primary" style="margin-top: 20px">Start exploring</a>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/main.js"></script>
  <script src="js/customize.js"></script>
  <script src="js/business.js"></script>
</body>
</html>
