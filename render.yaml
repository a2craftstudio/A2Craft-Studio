services:
  - type: web
    name: a2craft-studio
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm --prefix server ci --include=dev && npm run build:all
    startCommand: npm --prefix server start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_SSL
        value: no-verify
      - key: JWT_SECRET
        generateValue: true
      - key: SITE_ORIGIN
        value: https://a2craft-studio.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
